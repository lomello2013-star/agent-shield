name: pilot-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" || python -m pip install pytest pydantic cryptography
      - run: python -m pip install numpy
      - run: python -m pip install numpy lightgbm onnxruntime onnxmltools
      - run: python -m pytest -q --ignore=tests/test_winsource.py --ignore=tests/test_selfprotect.py -k "not blocks_network_with_firewall"
      - name: Linux packages
        run: VERSION=0.1.0 bash packaging/build_linux_packages.sh
      - name: Release manifest
        run: python scripts/release_manifest.py
      - uses: actions/upload-artifact@v4
        with:
          name: aidf-linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/release-manifest.json




