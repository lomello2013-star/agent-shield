[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aidefender"
version = "0.1.0"
description = "ИИ-защитник — лёгкий EDR (user-mode: reliability platform + contracts v3)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7,<3",
    "cryptography>=42,<51",
]

[project.scripts]
stmlctl = "stml.cli:main"

[project.optional-dependencies]
ml = [
    "numpy>=1.26,<3",
    "onnxruntime>=1.18,<2",
]
training = [
    "numpy>=1.26,<3",
    "lightgbm>=4,<5",
    "scikit-learn>=1.4,<2",
    "onnxmltools>=1.12,<2",
]
ops = [
    "psutil>=5.9,<8",
]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "coverage>=7,<8",
]
all = [
    "numpy>=1.26,<3",
    "onnxruntime>=1.18,<2",
    "psutil>=5.9,<8",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "coverage>=7,<8",
]

[tool.setuptools.packages.find]
include = ["core*", "schemas*", "stml*"]

[tool.setuptools.package-data]
"schemas.v3" = ["json_schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "stml/tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["core", "schemas"]
branch = false

[tool.coverage.report]
fail_under = 80
show_missing = true
