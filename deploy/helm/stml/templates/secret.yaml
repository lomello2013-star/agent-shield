{{- if not .Values.tokens.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-stml-tokens
type: Opaque
stringData:
  STML_TENANT: {{ .Values.tokens.tenant | quote }}
  STML_ADMIN_TOKEN: {{ .Values.tokens.admin | quote }}
  STML_VIEWER_TOKEN: {{ .Values.tokens.viewer | quote }}
  STML_APPROVER_TOKEN: {{ .Values.tokens.approver | quote }}
{{- end }}
