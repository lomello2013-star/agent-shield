apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-stml
spec:
  selector:
    app: {{ .Release.Name }}-stml
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-stml
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
