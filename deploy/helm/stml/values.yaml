image:
  repository: aidfender/stml
  tag: dev
  pullPolicy: IfNotPresent
# SQLite on a ReadWriteOnce volume supports one replica. Use PostgreSQL and a
# separate Rust deployment for real HA; see deploy/postgres/ha.md.
replicaCount: 1
service:
  port: 8080
persistence:
  size: 10Gi
# Prefer an existing Secret in production. If empty, the chart creates one from
# the values below (development only; never commit real tokens).
tokens:
  existingSecret: ""
  tenant: default
  admin: change-me-admin
  viewer: change-me-viewer
  approver: change-me-approver
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]
