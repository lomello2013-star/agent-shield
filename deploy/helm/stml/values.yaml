image:
  repository: aidfender/stml
  tag: dev
  pullPolicy: IfNotPresent
replicaCount: 2
service:
  port: 8080
persistence:
  size: 10Gi
env:
  STML_TENANT: default
  STML_ADMIN_TOKEN: change-me-admin
  STML_VIEWER_TOKEN: change-me-viewer
  STML_APPROVER_TOKEN: change-me-approver
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
